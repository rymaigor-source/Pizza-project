# Настройки админки Decap CMS.
# Вход через Netlify Identity + Git Gateway: владельцу сайта не нужен аккаунт GitHub,
# он входит по e-mail и паролю.

backend:
  name: git-gateway
  repo: rymaigor-source/Pizza-project
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/d679bb71-88e9-440c-8b6f-07758072e4e7/pkce
  auth_token_endpoint: /sites/d679bb71-88e9-440c-8b6f-07758072e4e7/token
  gateway_url: https://gateway.decapbridge.com


locale: ru
media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: site
    label: Мой сайт
    files:
      - name: settings
        label: Основные настройки
        file: content/settings.json
        fields:
          - { name: name, label: Название заведения, widget: string }
          - { name: tagline, label: Короткий слоган, widget: string, required: false }
          - { name: primary_color, label: Главный цвет сайта, widget: color, default: "#d9381e" }
          - { name: hero_title, label: Заголовок на первом экране, widget: string }
          - { name: hero_text, label: Текст на первом экране, widget: text }
          - { name: hero_image, label: Фото на первом экране, widget: image, required: false }
          - { name: about_title, label: Заголовок раздела "О нас", widget: string, required: false }
          - { name: about_text, label: Текст "О нас", widget: text, required: false }
          - { name: about_image, label: Фото "О нас", widget: image, required: false }
          - { name: phone, label: Телефон, widget: string }
          - { name: order_link, label: Ссылка для заказа (необязательно), widget: string, required: false }
          - { name: address, label: Адрес, widget: string }
          - { name: map_link, label: Ссылка на карту (Google Maps), widget: string, required: false }
          - name: hours
            label: Часы работы
            widget: list
            fields:
              - { name: days, label: Дни, widget: string }
              - { name: time, label: Время, widget: string }
          - { name: instagram, label: Instagram (ссылка), widget: string, required: false }
          - { name: facebook, label: Facebook (ссылка), widget: string, required: false }
          - { name: telegram, label: Telegram (ссылка), widget: string, required: false }
          - { name: currency, label: Валюта, widget: string, default: "грн" }

      - name: menu
                - { name: orders_enabled, label: "Заказы: включить корзину на сайте", widget: boolean, default: true }
          - name: order_mode
            label: "Заказы: куда отправлять заказ"
            widget: select
            default: whatsapp
            options:
              - { label: WhatsApp, value: whatsapp }
              - { label: Telegram, value: telegram }
              - { label: E-mail, value: email }
              - { label: "Webhook (Poster, Make, Zapier, n8n)", value: webhook }
          - { name: order_whatsapp, label: "Заказы: номер WhatsApp (с кодом страны, например 380501234567)", widget: string, required: false }
          - { name: order_telegram, label: "Заказы: Telegram (имя без @)", widget: string, required: false }
          - { name: order_email, label: "Заказы: e-mail для заказов", widget: string, required: false }
          - { name: order_webhook_url, label: "Заказы: адрес webhook (начинается с https://)", widget: string, required: false }
        label: Меню
        file: content/menu.json
        fields:
          - name: categories
            label: Разделы меню
            label_singular: Раздел
            widget: list
            fields:
              - { name: name, label: Название раздела, widget: string }
              - name: items
                label: Блюда
                label_singular: Блюдо
                widget: list
                fields:
                  - { name: title, label: Название, widget: string }
                  - { name: description, label: Описание, widget: text, required: false }
                  - { name: price, label: Цена, widget: string }
                  - { name: image, label: Фото, widget: image, required: false }
